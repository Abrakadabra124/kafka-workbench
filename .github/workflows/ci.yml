name: Quality and real Kafka checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kafka-workbench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check application
        run: npm run check
      - name: Audit dependencies
        run: npm audit --audit-level=high

  browser-and-kafka:
    name: Browser and real Kafka lab
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Check learning journey and accessibility
        run: npm run test:e2e
      - name: Check Docker availability
        run: docker info
      - name: Pull fixed Kafka version
        run: docker pull apache/kafka:4.2.2
      - name: Run real Kafka lab
        run: node --test tests/labs.test.mjs
        env:
          RUN_LIVE_LABS: '1'
      - name: Run real three-broker exercises
        run: node scripts/with-hardware-lock.mjs --test tests/workspace-live.test.mjs
        env:
          RUN_WORKSPACE_LIVE: '1'
      - name: Run real browser workspace journey
        run: node scripts/with-hardware-lock.mjs node_modules/@playwright/test/cli.js test tests/e2e/workspace-real.spec.mjs
        env:
          RUN_WORKSPACE_BROWSER: '1'
          KAFKA_QA_DIR: test-results/workspace-real
      - name: Run real failure and recovery practice
        run: npm run test:practice
      - name: Preserve real workspace evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-workspace-evidence
          path: |
            data/workspace-live-evidence.json
            data/workspace-browser-evidence.json
            data/practice-live-evidence.json
            test-results/workspace-real/
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
